<!DOCTYPE html>
<head>
<meta charset="utf-8">
<title>Ket keyboard</title>
<style>

p {
	margin: .5em 0;
	text-indent: 1em;
}

td {
	padding: 0 .3em;
}

:root {
	--cyrillic_font: "Noto Serif"
}

body {
	font-family: "Gentium", serif;
}

.input {
	font-style: italic;
	color: blue;
}

.Cyrl {
	font-family: var(--cyrillic_font);
}

table, td {
	text-align: center;
	border: 1px solid black;
	border-collapse: collapse;
}

.unused {
	color: gray;
}

.key {
	white-space: nowrap;
}

h1 {
	margin: 0;
}

</style>
</head>
<body onload="load_table(); load_list()">
<h1>Cyrillic keyboard</h1>
<p>
	This is an online extended Cyrillic keyboard for the Ket language, mainly thought for the Turkish keyboard layout.
</p>
<textarea type="text" id="input" oninput="dothing(this)" class="Cyrl" style="width:100%; height: 100px;" spellcheck="false" autofocus></textarea><br>
<input type="button" onclick="textinput.value = ''" value="clear"/> —
font: <input type="text" value="Noto Serif" oninput="set_font(this.value)"/>
<hr>
<table id="keyboardlayout"></table>
<hr>
<p>
	You can also type the following two-charactew combinations: <span id="keyboardlist"></span>. There are also ALT + key combinations: <span id="keyboardalt"></span>.
</p>
<script>

const one_char_replacements = {
	A: "А", a: "а",
	B: "Б", b: "б",
	V: "В", v: "в",
	G: "Г", g: "г",
	Ğ: "Ӷ", ğ: "ӷ",
	D: "Д", d: "д",
	E: "Е", e: "е",
	İ: "И", i: "и",
	Y: "Ь", y: "ь",
	K: "К", k: "к",
	Q: "Ӄ", q: "ӄ",
	L: "Л", l: "л",
	M: "М", m: "м",
	N: "Н", n: "н",
	O: "О", o: "о",
	Ö: "Ө", ö: "ө",
	P: "П", p: "п",
	R: "Р", r: "р",
	S: "С", s: "с",
	T: "Т", t: "т",
	U: "У", u: "у",
	H: "Х", h: "х",
	Q: "Ъ", q: "ъ",
	I: "Ы", ı: "ы",
	["'"]: "ʼ",
	J: "Ж", j: "ж",
	Z: "З", z: "з",
	Ş: "Ш", ş: "ш",
	F: "Ф", f: "ф",
	C: "Ц", c: "ц",
	Ç: "Ч", ç: "ч",
	W: "Щ", w: "щ",
	X: "Ә", x: "ә",
	Ü: "Э", ü: "э",
};

const two_char_replacements = [
	["ьo", "ё"],
	["ьu", "ю"],
	["ьa", "я"],
	["ь=", "й"],
	["н=", "ӈ"],
	["е=", "э"],
	["э=", "ә"],
	["с=", "ш"],
	["ш=", "щ"],
	["г=", "ӷ"],
	["о=", "ө"],
	["з=", "ж"],
	["ы=", "и"],
	["и=", "ы"],
	["ц=", "ч"],
];

const alt_key_combinations = {
	["."]: "·",
	["a"]: "\u0301", // acute
	["c"]: "\u0302", // circumflex
	["g"]: "\u0300", // grave
	["m"]: "\u0304", // macron
	["b"]: "\u0306", // breve
};

const textinput = document.getElementById("input")

textinput.addEventListener("keydown", (event) => {
	if (event.altKey) {
		const key = event.key.toLocaleLowerCase();
		if (alt_key_combinations[key]) {
			event.preventDefault();
			const start = textinput.selectionStart;
			const end = textinput.selectionEnd;
			const value = textinput.value;
			textinput.value = value.slice(0, start) + alt_key_combinations[key] + value.slice(end);
			textinput.selectionStart = textinput.selectionEnd = start + 1;
		}
	}
});

const root_props = document.querySelector(":root")
function set_font(name) {
	root_props.style.setProperty("--cyrillic_font", name)
}

function dothing(element) {
	// Set values to keep cursor still.
	let previous_cursor_position = element.selectionStart;
	let previous_textarea_length = element.value.length;
	// Do replacements.
	let str = element.value;
	two_char_replacements.forEach(element => {
		str = str
			.replace(new RegExp(element[0], 'g'), element[1])
			.replace(new RegExp(element[0], 'gi'), element[1].toUpperCase())
	});
	str = str
		.replace(/[A-zçğöışüÇĞÖİŞÜ]/g, x => one_char_replacements[x] ?? x)
		.replace(/#/g, '');
	element.value = str;
	// Keep cursor still.
	element.selectionEnd = element.selectionStart = previous_cursor_position + element.value.length - previous_textarea_length;
}

function load_table() {
	let str = "";
	const itlayout = [
		{ lowercase: "qwertyuıopğü", uppercase: "QWERTYUIOPĞÜ" },
		{ lowercase: "asdfghjklşi", uppercase: "ASDFGHJKLŞİ" },
		{ lowercase: "zxcvbnmöç", uppercase: "ZXCVBNMÖÇ" },
	];
	function str_thing(char) {
		let convert_char = one_char_replacements[char]
		if (convert_char) {
			if (/[\u0300-\u0345]/.test(convert_char)) convert_char = "◌" + convert_char
			return `
				<span class=input>${char}</span>
				<span class=Cyrl>${convert_char}</span>
			`;
		} else {
			return '<span class="input unused">' + char + "</span>"
		}
	}
	for (let i = 0; i < itlayout.length; i++) {
		str += "<tr>";
		if (i > 0) {
			str += "<td colspan=" + i + "></td>"
		}
		for (let j = 0; j < itlayout[i].lowercase.length; j++) {
			const lowercase_char = itlayout[i].lowercase.charAt(j);
			const uppercase_char = itlayout[i].uppercase.charAt(j);
			str += "<td class=key colspan=2>" + str_thing(uppercase_char) + "<br>" + str_thing(lowercase_char) + "</td>";
		}
		str += "</tr>";
	}
	document.getElementById("keyboardlayout").innerHTML = str;
}

function load_list() {
	let options = [];
	two_char_replacements.forEach(element => {
		options.push(`<span class=input>${element[0]}</span> for <span class=Cyrl>${element[1]}</span>`);
	});
	document.getElementById("keyboardlist").innerHTML = options.join(', ');
	let alt_options = [];
	Object.entries(alt_key_combinations).forEach(element => {
		let show = element[1];
		if (/[\u0300-\u0306]/.test(show)) {
			show = "◌" + show;
		}
		alt_options.push(`<span class=input>ALT + ${element[0]}</span> for <span class=Cyrl>${show}</span>`);
	});
	document.getElementById("keyboardalt").innerHTML = alt_options.join(', ');
}

</script>
</body>
